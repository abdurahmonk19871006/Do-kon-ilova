# AndroidX kutubxonalaridan foydalanish uchun majburiy — deyarli barcha zamonaviy
# Android kutubxonalar (Compose, Hilt, Room, Navigation...) AndroidX'ga tayanadi.
android.useAndroidX=true

# Har bir modul o'z R class'ini alohida generatsiya qiladi — build tezroq bo'ladi
android.nonTransitiveRClass=true

kotlin.code.style=official

# Gradle daemon uchun xotira — GitHub Actions runner'ida ham, oddiy kompyuterda ham yetarli
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
